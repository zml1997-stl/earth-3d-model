<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Earth | Professional Visualization</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            overflow: hidden;
            background: #000;
            font-family: 'Orbitron', sans-serif;
        }
        
        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
        }
        
        .overlay {
            position: fixed;
            bottom: 30px;
            left: 30px;
            color: rgba(255, 255, 255, 0.7);
            font-size: 12px;
            letter-spacing: 2px;
            text-transform: uppercase;
            pointer-events: none;
            z-index: 100;
        }
        
        .title {
            position: fixed;
            top: 30px;
            left: 30px;
            color: rgba(255, 255, 255, 0.9);
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 4px;
            pointer-events: none;
            z-index: 100;
        }
        
        .title span {
            color: #4fc3f7;
        }
        
        .coordinates {
            position: fixed;
            top: 30px;
            right: 30px;
            color: rgba(255, 255, 255, 0.5);
            font-size: 11px;
            text-align: right;
            pointer-events: none;
            z-index: 100;
            letter-spacing: 1px;
        }
        
        .controls-hint {
            position: fixed;
            bottom: 30px;
            right: 30px;
            color: rgba(255, 255, 255, 0.4);
            font-size: 10px;
            text-align: right;
            pointer-events: none;
            z-index: 100;
        }
        
        .loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #4fc3f7;
            font-size: 14px;
            letter-spacing: 3px;
            z-index: 1000;
            animation: pulse 1.5s ease-in-out infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }
        
        .loading.hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="loading" id="loading">INITIALIZING...</div>
    <div id="canvas-container"></div>
    
    <div class="title">EARTH <span>3D</span></div>
    <div class="coordinates" id="coords">
        LAT: 0.0000° N<br>
        LON: 0.0000° E
    </div>
    <div class="overlay" id="info">
        PROFESSIONAL MODEL<br>
        <span id="time"></span>
    </div>
    <div class="controls-hint">
        DRAG TO ROTATE • SCROLL TO ZOOM
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    
    <script>
        // Scene setup
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.outputEncoding = THREE.sRGBEncoding;
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // Camera position
        camera.position.z = 2.5;

        // Controls
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.enablePan = false;
        controls.minDistance = 1.5;
        controls.maxDistance = 5;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.3;

        // Texture loader
        const textureLoader = new THREE.TextureLoader();
        
        // Earth group
        const earthGroup = new THREE.Group();
        scene.add(earthGroup);

        // Earth geometry
        const earthGeometry = new THREE.SphereGeometry(1, 64, 64);

        // Earth material with textures
        const earthMaterial = new THREE.MeshPhongMaterial({
            map: textureLoader.load('https://unpkg.com/three-globe@2.24.13/example/img/earth-blue-marble.jpg'),
            bumpMap: textureLoader.load('https://unpkg.com/three-globe@2.24.13/example/img/earth-topology.png'),
            bumpScale: 0.05,
            specularMap: textureLoader.load('https://unpkg.com/three-globe@2.24.13/example/img/earth-water.png'),
            specular: new THREE.Color(0x333333),
            shininess: 15
        });

        const earth = new THREE.Mesh(earthGeometry, earthMaterial);
        earthGroup.add(earth);

        // Cloud layer
        const cloudGeometry = new THREE.SphereGeometry(1.01, 64, 64);
        const cloudMaterial = new THREE.MeshPhongMaterial({
            map: textureLoader.load('https://unpkg.com/three-globe@2.24.13/example/img/earth-clouds.png'),
            transparent: true,
            opacity: 0.4,
            blending: THREE.AdditiveBlending,
            side: THREE.DoubleSide
        });
        const clouds = new THREE.Mesh(cloudGeometry, cloudMaterial);
        earthGroup.add(clouds);

        // Atmosphere glow
        const atmosphereGeometry = new THREE.SphereGeometry(1.2, 64, 64);
        const atmosphereMaterial = new THREE.ShaderMaterial({
            vertexShader: `
                varying vec3 vNormal;
                void main() {
                    vNormal = normalize(normalMatrix * normal);
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                varying vec3 vNormal;
                void main() {
                    float intensity = pow(0.7 - dot(vNormal, vec3(0.0, 0.0, 1.0)), 2.0);
                    gl_FragColor = vec4(0.3, 0.6, 1.0, 1.0) * intensity;
                }
            `,
            blending: THREE.AdditiveBlending,
            side: THREE.BackSide,
            transparent: true
        });
        const atmosphere = new THREE.Mesh(atmosphereGeometry, atmosphereMaterial);
        scene.add(atmosphere);

        // Outer glow
        const glowGeometry = new THREE.SphereGeometry(1.35, 64, 64);
        const glowMaterial = new THREE.ShaderMaterial({
            vertexShader: `
                varying vec3 vNormal;
                void main() {
                    vNormal = normalize(normalMatrix * normal);
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                varying vec3 vNormal;
                void main() {
                    float intensity = pow(0.6 - dot(vNormal, vec3(0.0, 0.0, 1.0)), 3.0);
                    gl_FragColor = vec4(0.2, 0.4, 0.8, 0.3) * intensity;
                }
            `,
            blending: THREE.AdditiveBlending,
            side: THREE.BackSide,
            transparent: true
        });
        const glow = new THREE.Mesh(glowGeometry, glowMaterial);
        scene.add(glow);

        // Stars
        const starsGeometry = new THREE.BufferGeometry();
        const starCount = 5000;
        const positions = new Float32Array(starCount * 3);
        
        for (let i = 0; i < starCount * 3; i += 3) {
            const radius = 100 + Math.random() * 400;
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            
            positions[i] = radius * Math.sin(phi) * Math.cos(theta);
            positions[i + 1] = radius * Math.sin(phi) * Math.sin(theta);
            positions[i + 2] = radius * Math.cos(phi);
        }
        
        starsGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        const starsMaterial = new THREE.PointsMaterial({
            color: 0xffffff,
            size: 0.5,
            sizeAttenuation: true
        });
        const stars = new THREE.Points(starsGeometry, starsMaterial);
        scene.add(stars);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0x333333);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xffffff, 1.2);
        sunLight.position.set(5, 3, 5);
        scene.add(sunLight);

        const backLight = new THREE.DirectionalLight(0x4fc3f7, 0.3);
        backLight.position.set(-5, -3, -5);
        scene.add(backLight);

        // Mouse interaction for rotation
        let mouseX = 0, mouseY = 0;
        let targetRotationX = 0, targetRotationY = 0;

        document.addEventListener('mousemove', (event) => {
            mouseX = (event.clientX - window.innerWidth / 2) * 0.0005;
            mouseY = (event.clientY - window.innerHeight / 2) * 0.0005;
        });

        // Update coordinates display
        function updateCoordinates() {
            const lat = (mouseY * 90).toFixed(4);
            const lon = ((mouseX * 180 + 180) % 360 - 180).toFixed(4);
            
            const latDir = lat >= 0 ? 'N' : 'S';
            const lonDir = lon >= 0 ? 'E' : 'W';
            
            document.getElementById('coords').innerHTML = 
                `LAT: ${Math.abs(lat)}° ${latDir}<br>LON: ${Math.abs(lon)}° ${lonDir}`;
        }

        // Animation loop
        function animate() {
            requestAnimationFrame(animate);
            
            // Smooth mouse rotation
            targetRotationX += (mouseX - targetRotationX) * 0.05;
            targetRotationY += (mouseY - targetRotationY) * 0.05;
            
            earthGroup.rotation.y += 0.001;
            earthGroup.rotation.x = targetRotationY;
            earthGroup.rotation.z = targetRotationX;
            
            clouds.rotation.y += 0.0007;
            
            controls.update();
            updateCoordinates();
            
            renderer.render(scene, camera);
        }

        // Handle resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Hide loading
        setTimeout(() => {
            document.getElementById('loading').classList.add('hidden');
        }, 2000);

        // Start animation
        animate();

        // Update time
        function updateTime() {
            const now = new Date();
            document.getElementById('time').innerText = now.toISOString().slice(0, 19).replace('T', ' ');
        }
        setInterval(updateTime, 1000);
        updateTime();
    </script>
</body>
</html>
